name: backend
on: [push, pull_request]
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize local test secrets
        run: python3 scripts/init_env.py
      - name: Build and start
        run: docker compose up -d --build --wait
      - name: Quality, schema, and PostgreSQL tests
        run: |
          docker compose exec -T web ruff check .
          docker compose exec -T web ruff format --check .
          docker compose exec -T web python manage.py makemigrations --check --dry-run
          docker compose exec -T web python manage.py spectacular --file /tmp/openapi.yaml --validate --fail-on-warn
          docker compose exec -T web pytest -q
      - name: Real worker smoke test
        run: python3 scripts/smoke.py
      - name: Backup, restore, and migration rollback drill
        run: |
          sh scripts/backup.sh
          backup=$(ls -t backups/*.dump | head -1)
          sh scripts/verify_restore.sh "$backup"
          sh scripts/verify_rollback.sh "$backup"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop services
        if: always()
        run: docker compose down -v
